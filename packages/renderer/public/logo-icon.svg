<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" fill="none">
  <!-- Compact icon: Scales of Justice in gold circle for collapsed sidebar -->
  <circle cx="30" cy="30" r="28" fill="#0F2C4D"/>
  <circle cx="30" cy="30" r="27" stroke="#C9A227" stroke-width="1.5" fill="none"/>
  <!-- Center beam -->
  <line x1="30" y1="12" x2="30" y2="48" stroke="#C9A227" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top knob -->
  <circle cx="30" cy="12" r="3" fill="#C9A227"/>
  <!-- Horizontal beam -->
  <line x1="12" y1="20" x2="48" y2="20" stroke="#C9A227" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left scale pan chains -->
  <line x1="12" y1="20" x2="7" y2="30" stroke="#C9A227" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="12" y1="20" x2="17" y2="30" stroke="#C9A227" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Left scale pan -->
  <path d="M5 30 Q12 40 19 30" stroke="#C9A227" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Right scale pan chains -->
  <line x1="48" y1="20" x2="43" y2="30" stroke="#C9A227" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="48" y1="20" x2="53" y2="30" stroke="#C9A227" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Right scale pan -->
  <path d="M41 30 Q48 40 55 30" stroke="#C9A227" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="22" y1="48" x2="38" y2="48" stroke="#C9A227" stroke-width="2.5" stroke-linecap="round"/>
</svg>